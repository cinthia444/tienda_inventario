{% extends 'base.html' %}
{% block title %}Categorías{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Categorías</h3>
  <a class="btn btn-success" href="{{ url_for('category_new') }}">+ Nueva categoría</a>
</div>
<table class="table">
  <thead><tr><th>Nombre</th><th>Subcategoría</th><th># Productos</th><th>Acciones</th></tr></thead>
  <tbody>
    {% for c in categories %}
    <tr>
      <td>{{ c.name }}</td>
      <td>{{ c.get('subcategory','') }}</td>
      <td>{{ c.count }}</td>
      <td>
        <a class="btn btn-sm btn-primary" href="{{ url_for('category_edit', id=c._id) }}">Editar</a>
        <form method="post" action="{{ url_for('category_delete', id=c._id) }}" style="display:inline-block" onsubmit="return confirm('Eliminar?')">
          <button class="btn btn-sm btn-danger">Eliminar</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
