{% extends 'base.html' %}
{% block title %}{{ action }} producto{% endblock %}
{% block page_title %}{{ action }} producto{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card p-4">
      <form method="post" enctype="multipart/form-data">
        <div class="row g-3">
          <div class="col-md-8">
            <label class="form-label">Nombre</label>
            <input name="name" class="form-control" value="{{ product.name if product else '' }}" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Categoría</label>
            <select name="category_id" class="form-control">
              <option value="">Sin categoría</option>
              {% for c in categories %}
                <option value="{{ c._id }}" {% if product and product.get('category_id')==c._id %}selected{% endif %}>{{ c.name }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label">Cantidad</label>
            <input name="quantity" type="number" min="0" class="form-control" value="{{ product.quantity if product else 0 }}">
          </div>
          <div class="col-md-4">
            <label class="form-label">Precio</label>
            <input name="price" type="number" step="0.01" class="form-control" value="{{ product.price if product else 0 }}">
          </div>
          <div class="col-md-4">
            <label class="form-label">Imagen</label>
            <input name="image" type="file" class="form-control" onchange="previewImage(this)">
          </div>

          <div class="col-12">
            <label class="form-label">Descripción</label>
            <textarea name="description" class="form-control" rows="4">{{ product.description if product else '' }}</textarea>
          </div>

          <div class="col-12 d-flex justify-content-end">
            <button class="btn btn-primary">{{ action }}</button>
          </div>
        </div>
      </form>

      <div class="mt-3">
        {% if product and product.image %}
          <img id="imgPreview" src="/static/uploads/{{ product.image }}" width="200" class="mt-2"/>
        {% else %}
          <img id="imgPreview" src="#" class="hidden mt-2" width="200"/>
        {% endif %}
      </div>

    </div>
  </div>
</div>
{% endblock %}
